<!DOCTYPE html>

<html lang="es">



<head>



  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">



  <title>XV Años | Mia Nicole</title>



  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>



  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet">



  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alice&family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;1,400&display=swap');

    :root {
      --rojo: #8d0019;
      --rojo-oscuro: #4d000d;
      --rojo-claro: #c81d3b;
      --rojo-carmesim: #b4122c;
      --dorado: #c9a55c;
      --dorado-brillante: #f5d77f;
      --dorado-claro: #e3c984;
      --dorado-oscuro: #8f6c25;
      --crema: #f6efe4;
      --crema-oscuro: #e7d8c3;
      --crema-pergamino: #fdf8ef;
      --negro: #161313;
      --negro-terciopelo: #120813;
      --negro-carta: #1c101c;
      --azul-alicia: #7cb6d8;
      --sombrerero-purpura: #3b1647;
      --titulo: "Alice", "Cinzel Decorative", "Cinzel", serif;
      --nombre: "Great Vibes", cursive;
      --texto: "Montserrat", sans-serif;
      --sombras-oro: 0 10px 30px rgba(201, 165, 92, 0.25);
      --sombras-reina: 0 15px 40px rgba(141, 0, 25, 0.4);
    }

    /* =====================================================
   GENERAL & DESIGN SYSTEM
===================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--texto);
      background: var(--crema);
      color: var(--negro);
      overflow-x: hidden;
      line-height: 1.6;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(201, 165, 92, 0.08) 0%, transparent 70%),
        radial-gradient(circle at 0% 100%, rgba(141, 0, 25, 0.05) 0%, transparent 60%);
    }

    /* Scrollbar Customization */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--negro-terciopelo);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--rojo), var(--dorado));
      border-radius: 5px;
      border: 2px solid var(--negro-terciopelo);
    }

    ::selection {
      background: var(--rojo);
      color: var(--dorado-claro);
    }

    .seccion {
      position: relative;
      padding: 100px 20px;
      text-align: center;
    }

    .contenedor {
      width: 100%;
      max-width: 920px;
      margin: auto;
    }

    h2 {
      font-family: var(--titulo);
      font-size: clamp(2.2rem, 7vw, 3.8rem);
      color: var(--rojo);
      margin-bottom: 25px;
      text-shadow: 0 2px 10px rgba(141, 0, 25, 0.15);
      letter-spacing: 1px;
    }

    .subtitulo {
      font-family: var(--titulo);
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 0.85rem;
      margin-bottom: 12px;
      color: var(--dorado-oscuro);
      font-weight: 600;
    }

    .claro,
    .titulo-claro {
      color: #ffffff;
    }

    .titulo-claro {
      text-shadow: 0 0 15px rgba(245, 215, 127, 0.4), 0 3px 12px rgba(0, 0, 0, 0.8);
    }

    .corona,
    .simbolo {
      display: inline-block;
      color: var(--dorado);
      font-size: 2.8rem;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 8px rgba(201, 165, 92, 0.3));
      transition: transform 0.4s ease;
    }

    .corona:hover,
    .simbolo:hover {
      transform: scale(1.15) rotate(5deg);
    }

    /* =====================================================
   LLUVIA DE CARTAS (PLAYING CARD RAIN)
===================================================== */
    .lluvia-cartas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }

    .carta-lluvia {
      position: absolute;
      top: -120px;
      width: 50px;
      height: 72px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffffff 0%, #f7ebd9 100%);
      border: 1.5px solid var(--dorado);
      border-radius: 6px;
      font-family: Georgia, serif;
      font-size: 1.6rem;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 0 8px rgba(201, 165, 92, 0.2);
      opacity: 0;
      animation-name: caerCarta;
      animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      animation-fill-mode: forwards;
    }

    .carta-roja {
      color: var(--rojo);
      text-shadow: 0 1px 2px rgba(141, 0, 25, 0.3);
    }

    .carta-negra {
      color: var(--negro-carta);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    @keyframes caerCarta {
      0% {
        transform: translateY(-100px) translateX(0) rotate(0deg) rotateX(0deg);
        opacity: 0;
      }

      15% {
        opacity: 0.9;
      }

      40% {
        transform: translateY(35vh) translateX(35px) rotate(180deg) rotateY(180deg);
      }

      70% {
        transform: translateY(70vh) translateX(-30px) rotate(360deg) rotateX(180deg);
      }

      100% {
        transform: translateY(125vh) translateX(25px) rotate(540deg) rotateY(360deg);
        opacity: 0;
      }
    }

    /* =====================================================
   PORTADA (HERO SECTION)
===================================================== */
    .portada {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 50px 20px;
      color: white;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, rgba(141, 0, 25, 0.88) 0%, rgba(20, 4, 12, 0.98) 75%);
    }

    .portada::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url('patron-cartas.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 1;
    }

    .portada::before {
      content: "";
      position: absolute;
      inset: 20px;
      border: 2px solid var(--dorado);
      outline: 1px solid rgba(201, 165, 92, 0.3);
      outline-offset: -8px;
      pointer-events: none;
      z-index: 4;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
    }

    .portada-contenido {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 680px;
      text-align: center;
      padding: 20px;
    }

    .texto-pequeno {
      font-family: var(--titulo);
      letter-spacing: 8px;
      font-size: 0.9rem;
      color: var(--dorado-brillante);
      margin-bottom: 15px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(245, 215, 127, 0.5);
    }

    .portada h1 {
      font-family: var(--nombre);
      font-size: clamp(4.8rem, 18vw, 8.5rem);
      font-weight: normal;
      line-height: 0.95;
      background: linear-gradient(180deg, #ffffff 0%, var(--dorado-claro) 60%, var(--dorado) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.8));
      margin: 10px 0;
    }

    .separador {
      margin: 20px 0;
      color: var(--dorado-brillante);
      font-size: 2.4rem;
      text-shadow: 0 0 15px rgba(201, 165, 92, 0.8);
      animation: pulsoCrown 3s ease-in-out infinite;
    }

    @keyframes pulsoCrown {

      0%,
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 5px var(--dorado));
      }

      50% {
        transform: scale(1.12);
        filter: drop-shadow(0 0 18px var(--dorado-brillante));
      }
    }

    .frase-portada {
      max-width: 480px;
      margin: auto;
      line-height: 1.8;
      font-family: var(--titulo);
      font-size: 1.25rem;
      color: rgba(255, 255, 255, 0.92);
      font-style: italic;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .fecha-portada {
      margin: 28px 0 35px;
      color: var(--dorado-claro);
      font-family: var(--titulo);
      letter-spacing: 6px;
      font-size: 1.05rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      border-top: 1px solid rgba(201, 165, 92, 0.3);
      border-bottom: 1px solid rgba(201, 165, 92, 0.3);
      display: inline-block;
      padding: 10px 25px;
    }

    /* Royal Buttons */
    .btn-principal {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--rojo-carmesim) 0%, var(--rojo) 50%, var(--rojo-oscuro) 100%);
      color: var(--dorado-brillante);
      font-family: var(--titulo);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 18px 38px;
      border: 2px solid var(--dorado);
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(141, 0, 25, 0.5), inset 0 0 15px rgba(245, 215, 127, 0.3);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
      z-index: 1;
    }

    .btn-principal::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transition: left 0.6s ease;
      z-index: -1;
    }

    .btn-principal:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 15px 40px rgba(141, 0, 25, 0.7), 0 0 20px rgba(201, 165, 92, 0.6);
      border-color: #ffffff;
      color: #ffffff;
    }

    .btn-principal:hover::before {
      left: 100%;
    }

    .btn-principal:active {
      transform: translateY(-1px) scale(0.99);
    }

    .scroll-indicador {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-family: var(--titulo);
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--dorado-claro);
      opacity: 0.85;
    }

    .flecha {
      font-size: 1.4rem;
      margin-top: 5px;
      animation: flotarFlecha 2s infinite;
      color: var(--dorado-brillante);
    }

    @keyframes flotarFlecha {

      0%,
      100% {
        transform: translateY(0);
        opacity: 0.6;
      }

      50% {
        transform: translateY(8px);
        opacity: 1;
      }
    }

    /* =====================================================
   BIENVENIDA
===================================================== */
    .bienvenida {
      background: linear-gradient(180deg, var(--crema) 0%, var(--crema-pergamino) 100%);
    }

    .bienvenida .contenedor {
      background: rgba(253, 248, 239, 0.85);
      padding: 50px 30px;
      border-radius: 20px;
      border: 1px solid var(--dorado-claro);
      box-shadow: 0 15px 45px rgba(201, 165, 92, 0.15);
      backdrop-filter: blur(5px);
    }

    .marco-foto {
      position: relative;
      width: min(280px, 75vw);
      aspect-ratio: 4/5;
      margin: 25px auto 35px;
      border-radius: 180px 180px 20px 20px;
      padding: 10px;
      background: linear-gradient(135deg, var(--dorado-brillante) 0%, var(--dorado) 50%, var(--dorado-oscuro) 100%);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25), 0 0 20px rgba(201, 165, 92, 0.3);
    }

    .foto-mia {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 170px 170px 15px 15px;
      display: block;
      transition: transform 0.6s ease;
      border: 2px solid #ffffff;
    }

    .marco-foto:hover .foto-mia {
      transform: scale(1.04);
    }

    .texto-bienvenida {
      font-size: 1.15rem;
      line-height: 1.9;
      max-width: 600px;
      margin: 0 auto 20px;
      color: var(--negro);
    }

    .texto-destacado {
      font-family: var(--titulo);
      font-size: 1.3rem;
      color: var(--rojo);
      font-weight: 600;
      margin-top: 15px;
    }

    /* =====================================================
   PADRES Y PADRINOS
===================================================== */
    .padres-padrinos {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid rgba(201, 165, 92, 0.4);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .padres-padrinos p {
      font-family: var(--titulo);
      font-size: 1.1rem;
      color: var(--rojo-oscuro);
      line-height: 1.7;
      margin: 0;
    }

    .padres-padrinos p strong {
      display: block;
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--dorado-oscuro);
      margin-bottom: 6px;
      font-weight: 600;
    }

    /* =====================================================
   SEPARADOR ALICIA
===================================================== */
    .separador-alicia {
      width: 100%;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
      text-align: center;
    }

    .separador-alicia img {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      border-radius: 20px;
      border: 3px solid var(--dorado);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      transition: transform 0.5s ease;
    }

    .separador-alicia img:hover {
      transform: scale(1.015);
    }

    /* =====================================================
   TRANSICIÓN CARTAS
===================================================== */
    .transicion-cartas {
      background: var(--negro-terciopelo);
      padding: 25px 0;
      border-top: 2px solid var(--dorado);
      border-bottom: 2px solid var(--dorado);
    }

    .transicion-overlay {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      font-size: 2rem;
    }

    .transicion-overlay span {
      color: var(--dorado-brillante);
      animation: pulsoSuit 2s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 8px var(--dorado));
    }

    .transicion-overlay span:nth-child(2) {
      color: #ffffff;
      animation-delay: 0.3s;
    }

    .transicion-overlay span:nth-child(3) {
      color: var(--rojo-claro);
      animation-delay: 0.6s;
    }

    .transicion-overlay span:nth-child(4) {
      color: var(--dorado-claro);
      animation-delay: 0.9s;
    }

    @keyframes pulsoSuit {
      0% {
        transform: scale(1) translateY(0);
      }

      100% {
        transform: scale(1.25) translateY(-4px);
      }
    }

    /* =====================================================
   LA CORTE DE LA REINA
===================================================== */
    .corte-reina {
      background: linear-gradient(135deg, #3a000a 0%, #170004 60%, #0d0002 100%);
      color: white;
      overflow: hidden;
      position: relative;
    }

    .decoracion-reina {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: clamp(6rem, 15vw, 12rem);
      opacity: 0.08;
      color: var(--rojo-claro);
      pointer-events: none;
    }

    .decoracion-izquierda {
      left: -30px;
    }

    .decoracion-derecha {
      right: -30px;
    }

    .subtitulo-reina {
      font-family: var(--titulo);
      color: var(--dorado-brillante);
      letter-spacing: 5px;
      font-size: 0.95rem;
      margin-bottom: 35px;
      text-shadow: 0 0 10px rgba(245, 215, 127, 0.5);
    }

    .reina-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 40px;
      align-items: center;
      text-align: left;
      background: rgba(20, 5, 10, 0.6);
      padding: 40px;
      border-radius: 24px;
      border: 2px solid var(--dorado);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(141, 0, 25, 0.3);
    }

    .reina-imagen-contenedor {
      position: relative;
      text-align: center;
    }

    .corona-reina {
      font-size: 3rem;
      color: var(--dorado-brillante);
      margin-bottom: -15px;
      position: relative;
      z-index: 2;
      animation: pulsoCrown 2.5s infinite;
    }

    .imagen-reina {
      width: 100%;
      max-width: 320px;
      height: auto;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.7));
      transition: transform 0.5s ease;
    }

    .imagen-reina:hover {
      transform: scale(1.05) rotate(2deg);
    }

    .reina-texto {
      background: rgba(253, 248, 239, 0.96);
      color: var(--negro);
      padding: 35px 30px;
      border-radius: 16px;
      border: 2px solid var(--dorado);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .reina-corazon {
      color: var(--rojo);
      font-size: 2rem;
      display: block;
      margin-bottom: 5px;
    }

    .reina-pretexto {
      font-family: var(--titulo);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 0.8rem;
      color: var(--rojo);
    }

    .reina-texto h2 {
      color: var(--rojo);
      font-size: clamp(2rem, 5vw, 2.8rem);
      margin-bottom: 15px;
      line-height: 1.1;
    }

    .reina-texto h2 span {
      font-family: var(--nombre);
      display: block;
      font-size: 3.2rem;
      color: var(--rojo-oscuro);
      font-weight: normal;
    }

    .separador-reina {
      color: var(--dorado-oscuro);
      letter-spacing: 6px;
      font-size: 1.2rem;
      margin: 15px 0;
    }

    .reina-mensaje {
      font-family: var(--titulo);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--rojo-oscuro);
      margin-bottom: 10px;
    }

    .reina-descripcion {
      font-size: 1rem;
      line-height: 1.7;
      color: #333333;
      margin-bottom: 20px;
    }

    .reina-fecha {
      display: inline-block;
      background: var(--rojo);
      color: white;
      padding: 12px 25px;
      border-radius: 30px;
      font-family: var(--titulo);
      letter-spacing: 2px;
      font-size: 0.9rem;
      box-shadow: 0 6px 18px rgba(141, 0, 25, 0.4);
    }

    .reina-fecha strong {
      font-size: 1.4rem;
      color: var(--dorado-brillante);
      margin: 0 6px;
    }

    /* =====================================================
   FRANJA REINA
===================================================== */
    .franja-reina {
      background: linear-gradient(90deg, var(--rojo-oscuro) 0%, var(--rojo) 50%, var(--rojo-oscuro) 100%);
      color: var(--dorado-brillante);
      padding: 18px 20px;
      font-family: var(--titulo);
      letter-spacing: 4px;
      font-size: 1.05rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      border-top: 2px solid var(--dorado);
      border-bottom: 2px solid var(--dorado);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .franja-reina span {
      font-size: 1.3rem;
    }

    /* =====================================================
   CUENTA REGRESIVA
===================================================== */
    .cuenta-regresiva {
      background: radial-gradient(circle at center, #1b0a1c 0%, #0c040d 100%);
      color: white;
      padding: 110px 20px;
    }

    .reloj-icono {
      font-size: 3.5rem;
      margin-bottom: 15px;
      display: inline-block;
      animation: balanceoClock 3s ease-in-out infinite;
      filter: drop-shadow(0 0 15px rgba(245, 215, 127, 0.5));
    }

    @keyframes balanceoClock {

      0%,
      100% {
        transform: rotate(-8deg);
      }

      50% {
        transform: rotate(8deg);
      }
    }

    .fecha-evento {
      font-family: var(--titulo);
      color: var(--dorado-claro);
      letter-spacing: 3px;
      font-size: 1rem;
      margin-bottom: 40px;
    }

    .contador {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      max-width: 750px;
      margin: auto;
    }

    .contador-item {
      background: rgba(35, 12, 38, 0.85);
      border: 2px solid var(--dorado);
      border-radius: 18px;
      padding: 22px 18px;
      min-width: 125px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(201, 165, 92, 0.2);
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .contador-item:hover {
      transform: translateY(-6px);
      border-color: #ffffff;
    }

    .contador-item span {
      font-family: var(--titulo);
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      font-weight: 700;
      color: var(--dorado-brillante);
      display: block;
      line-height: 1;
      text-shadow: 0 0 12px rgba(245, 215, 127, 0.6);
    }

    .contador-item small {
      font-family: var(--titulo);
      letter-spacing: 3px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 8px;
      display: block;
    }

    /* =====================================================
   LUGAR (CEREMONIA & RECEPCIÓN)
===================================================== */
    .lugar {
      background: var(--crema);
    }

    .tarjeta-lugar {
      background: var(--crema-pergamino);
      border: 2px solid var(--dorado);
      border-radius: 20px;
      padding: 45px 30px;
      max-width: 550px;
      margin: 30px auto 0;
      box-shadow: 0 15px 40px rgba(201, 165, 92, 0.2);
      position: relative;
      overflow: hidden;
    }

    .tarjeta-lugar::before {
      content: "♥";
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.8rem;
      color: rgba(141, 0, 25, 0.15);
    }

    .icono-lugar {
      font-size: 3rem;
      margin-bottom: 15px;
      display: inline-block;
      background: linear-gradient(135deg, var(--dorado-brillante), var(--dorado-oscuro));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
    }

    .tarjeta-lugar h3 {
      font-family: var(--titulo);
      letter-spacing: 4px;
      color: var(--rojo);
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .nombre-lugar {
      font-family: var(--titulo);
      font-size: 1.8rem;
      color: var(--negro);
      margin-bottom: 10px;
    }

    .tarjeta-lugar strong {
      display: block;
      font-size: 1.4rem;
      color: var(--rojo-carmesim);
      margin: 10px 0;
      font-family: var(--titulo);
    }

    .direccion {
      color: #666666;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .btn-secundario {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--rojo);
      font-family: var(--titulo);
      font-weight: 600;
      letter-spacing: 2px;
      padding: 14px 30px;
      border: 2px solid var(--rojo);
      border-radius: 40px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .btn-secundario:hover {
      background: var(--rojo);
      color: white;
      box-shadow: 0 8px 25px rgba(141, 0, 25, 0.4);
      transform: translateY(-2px);
    }

    /* Cheshire Cat Floating Animation */
    .gato-recepcion {
      width: min(240px, 60vw);
      height: auto;
      margin: 0 auto 20px;
      display: block;
      filter: drop-shadow(0 10px 25px rgba(123, 75, 178, 0.5));
      animation: gatoFlotante 4s ease-in-out infinite;
    }

    @keyframes gatoFlotante {

      0%,
      100% {
        transform: translateY(0) rotate(-2deg) scale(1);
      }

      50% {
        transform: translateY(-12px) rotate(2deg) scale(1.04);
      }
    }

    /* =====================================================
   ITINERARIO
===================================================== */
    .itinerario {
      background: linear-gradient(180deg, #17051a 0%, #290a2e 100%);
      color: white;
      padding: 100px 20px;
    }

    .conejo-animado {
      width: min(180px, 50vw);
      height: auto;
      margin: 0 auto 20px;
      display: block;
      filter: drop-shadow(0 10px 20px rgba(245, 215, 127, 0.4));
      animation: conejoSaltarin 3s ease-in-out infinite;
    }

    @keyframes conejoSaltarin {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-10px) rotate(-3deg);
      }
    }

    .itinerario-intro {
      color: var(--dorado-claro);
      font-family: var(--titulo);
      margin-bottom: 50px;
      font-style: italic;
    }

    .timeline {
      position: relative;
      max-width: 650px;
      margin: auto;
      padding-left: 20px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 30px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--dorado-brillante), var(--rojo-claro), var(--dorado));
      border-radius: 2px;
    }

    .evento {
      display: flex;
      align-items: center;
      gap: 25px;
      margin-bottom: 35px;
      position: relative;
      text-align: left;
    }

    .hora {
      font-family: var(--titulo);
      font-weight: 700;
      color: var(--dorado-brillante);
      min-width: 110px;
      font-size: 1.1rem;
      text-align: right;
      text-shadow: 0 0 8px rgba(245, 215, 127, 0.4);
    }

    .punto {
      width: 32px;
      height: 32px;
      background: var(--rojo);
      color: var(--dorado-brillante);
      border: 2px solid var(--dorado);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      z-index: 2;
      box-shadow: 0 0 12px rgba(201, 165, 92, 0.6);
      flex-shrink: 0;
    }

    .evento-info {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(201, 165, 92, 0.3);
      padding: 15px 25px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 15px;
      flex: 1;
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .evento-info:hover {
      transform: translateX(6px);
      border-color: var(--dorado-brillante);
      background: rgba(255, 255, 255, 0.12);
    }

    .evento-info span {
      font-size: 1.8rem;
    }

    .evento-info h3 {
      font-family: var(--titulo);
      font-size: 1.2rem;
      color: white;
      font-weight: 500;
    }

    /* =====================================================
   DRESS CODE
===================================================== */
    .dress-code {
      background: linear-gradient(135deg, #2b0007 0%, #150003 100%);
      color: white;
    }

    .dress-code
